<div class="radio-group">
  @if (label()) {
    <span class="radio-group-label" [id]="labelId">{{ label() }}</span>
  }

  <div
    [class]="listClass()"
    role="radiogroup"
    [attr.aria-labelledby]="label() ? labelId : null"
    [attr.aria-describedby]="errorMessage() ? errorId : null"
    [attr.aria-invalid]="errorMessage() ? true : null"
  >
    @for (option of options(); track option.value) {
      <label
        class="radio-item"
        [class.radio-item--disabled]="isOptionDisabled(option)"
        [class.radio-item--checked]="isChecked(option)"
      >
        <input
          class="radio-input"
          type="radio"
          [name]="name()"
          [value]="option.value"
          [checked]="isChecked(option)"
          [disabled]="isOptionDisabled(option)"
          (change)="onSelect($event)"
        />
        <span class="radio-circle" aria-hidden="true"></span>
        <span class="radio-text">{{ option.label }}</span>
      </label>
    }
  </div>

  @if (errorMessage()) {
    <p class="radio-error" [id]="errorId" role="alert">{{ errorMessage() }}</p>
  }
</div>
