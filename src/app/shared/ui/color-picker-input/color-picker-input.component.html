<div class="color-wrapper">
  @if (label()) {
    <label class="color-label" [for]="inputId">{{ label() }}</label>
  }

  <div
    class="color-control"
    [class.color-control--error]="!!errorMessage()"
    [class.color-control--disabled]="disabled()"
  >
    <label class="color-swatch-label" [for]="pickerId" [attr.aria-label]="'Seleccionar color, actual: ' + pickerValue()">
      <span class="color-swatch" [style.background-color]="pickerValue()" aria-hidden="true"></span>
      <input
        [id]="pickerId"
        class="color-picker-native"
        type="color"
        [value]="pickerValue()"
        [disabled]="disabled()"
        aria-hidden="true"
        tabindex="-1"
        (change)="onPickerChange($event)"
      />
    </label>

    <input
      [class]="fieldClass()"
      [class.color-text-field--invalid]="!isTextValid()"
      [id]="inputId"
      type="text"
      maxlength="7"
      placeholder="#000000"
      [value]="textValue()"
      [disabled]="disabled()"
      [attr.aria-invalid]="!isTextValid() || !!errorMessage() ? true : null"
      [attr.aria-describedby]="errorMessage() ? errorId : null"
      aria-label="Valor hexadecimal del color"
      (input)="onTextInput($event)"
    />
  </div>

  @if (errorMessage()) {
    <p class="color-error" [id]="errorId" role="alert">{{ errorMessage() }}</p>
  }
</div>
