<div class="excel-upload">
  @if (!file()) {
    <div
      class="excel-dropzone"
      [class.excel-dropzone--dragover]="isDragOver()"
      [class.excel-dropzone--disabled]="disabled()"
      [class.excel-dropzone--error]="!!displayError()"
      role="button"
      tabindex="{{ disabled() ? -1 : 0 }}"
      [attr.aria-label]="label()"
      [attr.aria-disabled]="disabled() || null"
      (click)="openPicker()"
      (keydown.enter)="openPicker()"
      (keydown.space)="openPicker(); $event.preventDefault()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <svg
        class="excel-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 10h18M3 14h18M10 3v18M14 3v18M3 6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6z" />
      </svg>

      <p class="excel-dropzone-title">
        Arrastra tu archivo aquí o
        <span class="excel-dropzone-action">selecciona</span>
      </p>
      <p class="excel-dropzone-hint">{{ accept() }} · máx. {{ maxSizeMb() }} MB</p>

      <input
        #fileInput
        class="sr-only"
        type="file"
        [accept]="accept()"
        [disabled]="disabled()"
        (change)="onFileChange($event)"
      />
    </div>
  } @else {
    <div class="excel-preview">
      <div class="excel-preview-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10h18M3 14h18M10 3v18M14 3v18M3 6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6z" />
        </svg>
      </div>

      <div class="excel-preview-info">
        <span class="excel-preview-name">{{ file()!.name }}</span>
        <span class="excel-preview-size">{{ formatSize(file()!.size) }}</span>
      </div>

      <button
        type="button"
        class="excel-remove-btn"
        aria-label="Quitar archivo"
        [disabled]="disabled()"
        (click)="removeFile()"
      >
        <svg class="excel-remove-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }

  @if (displayError()) {
    <p class="excel-error" role="alert">{{ displayError() }}</p>
  }
</div>
