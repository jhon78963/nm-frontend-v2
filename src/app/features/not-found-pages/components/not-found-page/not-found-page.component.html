<section class="not-found" aria-labelledby="not-found-title">
  <div class="not-found__card">
    <p class="not-found__code" aria-hidden="true">404</p>

    <div class="not-found__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"
        />
      </svg>
    </div>

    <h1 id="not-found-title" class="not-found__title">Página no encontrada</h1>
    <p class="not-found__message">
      La página que buscas no existe, fue movida o ya no está disponible.
    </p>

    <div class="not-found__actions">
      <app-button type="button" variant="primary" (clicked)="goHome()">
        Ir al inicio
      </app-button>
    </div>
  </div>
</section>
