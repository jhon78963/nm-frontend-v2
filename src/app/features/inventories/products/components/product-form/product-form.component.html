<div class="flex flex-col gap-6">
  @if (loadError()) {
    <app-alert variant="error" [message]="loadError()" />
  }

  @if (loadingData()) {
    <div class="flex items-center justify-center py-12">
      <div class="flex flex-col items-center gap-3">
        <svg
          class="h-10 w-10 animate-spin text-sky-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <p class="text-sm text-gray-600">Cargando producto...</p>
      </div>
    </div>
  } @else {
    <form (submit)="submit($event)" class="flex flex-col gap-6" novalidate>
      <div class="grid gap-6 md:grid-cols-2">
        <app-select
          label="Género *"
          placeholder="Seleccione género"
          [options]="genderOptions()"
          [formField]="productForm.genderId"
          [errorMessage]="genderError()" />

        <app-select
          label="Almacén *"
          placeholder="Seleccione almacén"
          [options]="warehouseOptions()"
          [formField]="productForm.warehouseId"
          [errorMessage]="warehouseError()" />
      </div>

      <app-input
        type="text"
        label="Nombre del producto *"
        placeholder="Ingrese nombre del producto"
        [formField]="productForm.name"
        [errorMessage]="nameError()" />

      <div class="flex items-center justify-end gap-3 border-t pt-6">
        <button
          type="button"
          (click)="close()"
          [disabled]="saving()"
          class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="saving()"
          class="inline-flex items-center gap-2 rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
          @if (saving()) {
            <svg
              class="h-4 w-4 animate-spin"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Guardando...
          } @else {
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7" />
            </svg>
            {{ isEditing() ? 'Actualizar' : 'Crear' }} producto
          }
        </button>
      </div>
    </form>
  }
</div>
