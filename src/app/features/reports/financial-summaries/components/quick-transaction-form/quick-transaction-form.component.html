<div
  class="fixed inset-0 z-50 flex items-end justify-center bg-black/40 p-0 backdrop-blur-sm sm:items-center sm:p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="quick-transaction-title"
  (click)="onClose()"
>
  <div
    class="flex max-h-[92vh] w-full max-w-md flex-col overflow-hidden rounded-t-2xl bg-white shadow-2xl sm:rounded-2xl"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
      <h2
        id="quick-transaction-title"
        class="text-base font-semibold"
        [class]="titleAccentClass()"
      >
        {{ title() }}
      </h2>
      <button
        type="button"
        class="rounded-lg p-1.5 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        aria-label="Cerrar"
        [disabled]="saving()"
        (click)="onClose()"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form class="flex-1 overflow-y-auto px-5 py-4" (submit)="$event.preventDefault(); onSubmit()">
      <div class="space-y-5">
        <div>
          <app-money-input
            label="Monto"
            [errorMessage]="amountError()"
            [formField]="transactionForm.amount"
          />
          <p class="mt-1.5 text-xs text-gray-500">
            Se registrará en efectivo para el día de hoy.
          </p>
        </div>

        <fieldset>
          <legend class="mb-3 text-xs font-semibold uppercase tracking-wide text-gray-400">
            Categoría
          </legend>
          <div class="grid grid-cols-2 gap-2">
            @for (category of categories(); track category.id) {
              <button
                type="button"
                class="flex items-center gap-3 rounded-xl border px-3 py-3 text-left text-sm font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
                [class.border-gray-900]="isCategorySelected(category)"
                [class.bg-gray-50]="isCategorySelected(category)"
                [class.border-gray-200]="!isCategorySelected(category)"
                [class.hover:border-indigo-300]="!isCategorySelected(category)"
                [class.hover:bg-indigo-50]="!isCategorySelected(category)"
                [attr.aria-pressed]="isCategorySelected(category)"
                (click)="selectCategory(category)"
              >
                <span
                  class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full"
                  [class.bg-emerald-50]="category.icon === 'sale'"
                  [class.text-emerald-600]="category.icon === 'sale'"
                  [class.bg-blue-50]="category.icon === 'capital'"
                  [class.text-blue-600]="category.icon === 'capital'"
                  [class.bg-orange-50]="category.icon === 'transport' || category.icon === 'food'"
                  [class.text-orange-600]="category.icon === 'transport' || category.icon === 'food'"
                  [class.bg-purple-50]="category.icon === 'store'"
                  [class.text-purple-600]="category.icon === 'store'"
                  [class.bg-gray-100]="category.icon === 'other'"
                  [class.text-gray-600]="category.icon === 'other'"
                >
                  @switch (category.icon) {
                    @case ('sale') {
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                      </svg>
                    }
                    @case ('capital') {
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                      </svg>
                    }
                    @case ('transport') {
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 17h8M5 11l1-4h12l1 4M6 17a1 1 0 11-2 0 1 1 0 012 0zm14 0a1 1 0 11-2 0 1 1 0 012 0zM7 11h10" />
                      </svg>
                    }
                    @case ('food') {
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v13M8 12V4a2 2 0 114 0v8M16 12V4a2 2 0 114 0v8" />
                      </svg>
                    }
                    @case ('store') {
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                      </svg>
                    }
                    @default {
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h.01M12 12h.01M19 12h.01" />
                      </svg>
                    }
                  }
                </span>
                <span class="text-gray-900">{{ category.name }}</span>
              </button>
            }
          </div>
        </fieldset>
      </div>

      <div class="mt-6 flex gap-3 border-t border-gray-100 pt-4">
        <app-button
          class="flex-1"
          variant="secondary"
          [disabled]="saving()"
          (clicked)="onClose()"
        >
          Cancelar
        </app-button>
        <app-button
          class="flex-1"
          [disabled]="!canSubmit()"
          [loading]="saving()"
          (clicked)="onSubmit()"
        >
          Guardar
        </app-button>
      </div>
    </form>
  </div>
</div>
