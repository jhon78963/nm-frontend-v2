<div
  class="fixed inset-0 z-50 flex items-end justify-center bg-black/40 p-0 backdrop-blur-sm sm:items-center sm:p-4"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'movement-form-title'"
  (click)="onClose()"
>
  <div
    class="flex max-h-[92vh] w-full max-w-md flex-col overflow-hidden rounded-t-2xl bg-white shadow-2xl sm:rounded-2xl"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
      <h2 id="movement-form-title" class="text-base font-semibold text-gray-900">
        {{ title() }}
      </h2>
      <button
        type="button"
        class="rounded-lg p-1.5 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        aria-label="Cerrar"
        [disabled]="saving()"
        (click)="onClose()"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto px-5 py-4">
      <div class="space-y-5">
        @if (movementType() === 'EXPENSE' && !isEditing()) {
          <div>
            <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-gray-400">
              Gastos frecuentes
            </p>
            <div class="grid grid-cols-3 gap-2">
              @for (preset of quickExpenses; track preset.label) {
                <button
                  type="button"
                  class="flex flex-col items-center gap-1 rounded-xl border border-gray-200 bg-gray-50 px-2 py-3 text-center text-xs font-medium text-gray-700 transition-colors hover:border-indigo-300 hover:bg-indigo-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
                  (click)="applyQuickExpense(preset.label, preset.amount)"
                >
                  @switch (preset.icon) {
                    @case ('car') {
                      <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 17h8M5 11l1-4h12l1 4M6 17a1 1 0 11-2 0 1 1 0 012 0zm14 0a1 1 0 11-2 0 1 1 0 012 0zM7 11h10" />
                      </svg>
                    }
                    @case ('food') {
                      <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v13M8 12V4a2 2 0 114 0v8M16 12V4a2 2 0 114 0v8" />
                      </svg>
                    }
                    @case ('shield') {
                      <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                      </svg>
                    }
                  }
                  <span>{{ preset.label }}</span>
                  <span class="rounded-md bg-white px-1.5 py-0.5 text-[10px] font-bold text-gray-600">
                    S/ {{ preset.amount }}
                  </span>
                </button>
              }
            </div>
          </div>
        }

        @if (isAdmin()) {
          <div>
            <label class="mb-1 block text-sm font-medium text-gray-700" for="movement-datetime">
              Fecha y hora
            </label>
            <input
              id="movement-datetime"
              type="datetime-local"
              class="w-full rounded-xl border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-indigo-500"
              [value]="formModel().date"
              (input)="onDateTimeChange($any($event.target).value)"
            />
          </div>
        }

        <div>
          <app-select
            label="Método de pago"
            [options]="paymentOptions"
            [formField]="movementForm.paymentMethod"
          />
        </div>

        <div>
          <app-input
            label="Descripción *"
            placeholder="Ej: Pago de servicios"
            [formField]="movementForm.description"
            [errorMessage]="descriptionError()"
          />
        </div>

        <div>
          <app-money-input
            label="Monto *"
            [formField]="movementForm.amount"
            [errorMessage]="amountError()"
          />
        </div>
      </div>
    </div>

    <div class="border-t border-gray-100 px-5 py-4">
      <app-button
        type="button"
        [variant]="movementType() === 'INCOME' ? 'primary' : 'danger'"
        class="w-full"
        [loading]="saving()"
        [disabled]="!canSubmit()"
        (clicked)="onSubmit()"
      >
        {{ saveLabel() }}
      </app-button>
    </div>
  </div>
</div>
