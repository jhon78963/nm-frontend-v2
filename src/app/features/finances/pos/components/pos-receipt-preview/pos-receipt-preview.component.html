@if (isOpen()) {
  <div
    class="receipt-preview-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="pos-receipt-preview-title"
    (click)="onBackdropClick()"
  >
    <div class="receipt-preview-panel" (click)="$event.stopPropagation()">
      <header class="receipt-preview-header">
        <div>
          <h2 id="pos-receipt-preview-title" class="receipt-preview-title">
            Vista previa del ticket
          </h2>
          <p class="receipt-preview-subtitle">
            {{ receiptData().receiptNumber }} · S/ {{ receiptData().total | number: '1.2-2' }}
          </p>
        </div>
        <app-table-action-button
          label="Cerrar vista previa"
          tone="neutral"
          (clicked)="onClose()"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </app-table-action-button>
      </header>

      <div class="receipt-preview-body">
        <iframe
          class="receipt-preview-frame"
          title="Vista previa del ticket"
          [srcdoc]="previewSrcdoc()"
        ></iframe>
      </div>

      <footer class="receipt-preview-actions">
        <app-button
          type="button"
          variant="primary"
          data-testid="pos-print-thermal"
          (clicked)="print('thermal-80mm')"
        >
          Imprimir
        </app-button>
        <app-button
          type="button"
          variant="secondary"
          data-testid="pos-receipt-close"
          (clicked)="onClose()"
        >
          Cerrar
        </app-button>
      </footer>
    </div>
  </div>
}
