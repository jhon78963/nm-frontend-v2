<header class="shrink-0 border-b border-gray-100 bg-white px-4 py-3">
  <!-- Customer search -->
  <div class="relative flex items-center gap-2">
    <div class="relative flex-1">
      <span
        class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
        aria-hidden="true"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </span>
      <input
        type="tel"
        inputmode="numeric"
        autocomplete="off"
        placeholder="DNI / RUC del cliente…"
        [value]="dniQuery()"
        (input)="onDniInput($event)"
        (keydown.enter)="search()"
        class="w-full rounded-xl border border-gray-200 bg-gray-50 py-2.5 pl-10 pr-4 text-sm font-medium text-gray-800 placeholder:text-gray-400 focus:border-violet-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-violet-400/20 transition-all"
        aria-label="Buscar cliente por DNI o RUC"
      />
    </div>

    <button
      type="button"
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-violet-600 text-white shadow-sm transition-colors hover:bg-violet-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 focus-visible:ring-offset-2 disabled:opacity-60"
      [disabled]="isSearching() || !dniQuery().trim()"
      (click)="search()"
      aria-label="Buscar cliente"
    >
      @if (isSearching()) {
        <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
      } @else {
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      }
    </button>
  </div>

  <!-- Customer card -->
  @if (posService.currentCustomer(); as customer) {
    <div
      class="mt-2.5 flex items-center justify-between rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2"
      role="status"
      aria-label="Cliente seleccionado"
    >
      <div class="flex min-w-0 items-center gap-2.5">
        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-emerald-600 text-white" aria-hidden="true">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </span>
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-emerald-900">{{ customer.name }}</p>
          <p class="text-xs text-emerald-600">
            {{ customer.document_type ?? 'DNI' }}: {{ customer.dni }}
          </p>
        </div>
      </div>
      <button
        type="button"
        class="ml-2 shrink-0 rounded-lg p-1 text-emerald-600 transition-colors hover:bg-emerald-200 hover:text-emerald-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"
        (click)="reset()"
        aria-label="Quitar cliente seleccionado"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
</header>
