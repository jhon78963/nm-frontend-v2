<div class="space-y-8">
  <header class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-gray-900">
        {{ greeting() }}
      </h1>
      <p class="mt-1 text-sm text-gray-500">
        {{ formattedDate }}
        <span class="mx-1.5 text-gray-300" aria-hidden="true">·</span>
        {{ warehouseLabel() }}
      </p>
    </div>

    @if (userRole()) {
      <span
        class="inline-flex w-fit items-center rounded-full bg-orange-50 px-3 py-1 text-xs font-semibold text-orange-700 ring-1 ring-inset ring-orange-200"
      >
        {{ userRole() }}
      </span>
    }
  </header>

  @if (canViewMetrics()) {
    <section aria-labelledby="metrics-title">
      <h2 id="metrics-title" class="sr-only">Métricas del día</h2>
      <div class="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6">
        @for (card of metricCards(); track card.label) {
          <app-metric-card
            [label]="card.label"
            [value]="card.value"
            [icon]="card.icon"
            [colorVariant]="card.colorVariant"
            [format]="card.format"
            [isLoading]="isLoading()"
          />
        }
      </div>
    </section>
  }

  <app-quick-access-grid />
</div>
