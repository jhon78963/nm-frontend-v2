<div
  class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm"
  aria-hidden="true"
  (click)="onClose()"
></div>

<aside
  class="fixed inset-y-0 right-0 z-[60] flex w-full max-w-lg flex-col bg-white shadow-2xl"
  role="dialog"
  aria-modal="true"
  aria-labelledby="accumulated-expense-form-title"
>
  <div class="flex items-center justify-between border-b border-gray-200 px-6 py-5">
    <div class="flex items-center gap-3">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-emerald-100">
        <svg class="h-5 w-5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
      </div>
      <div>
        <h2 id="accumulated-expense-form-title" class="text-base font-semibold text-gray-900">
          {{ title() }}
        </h2>
        <p class="text-xs text-gray-400">
          Dinero que sale del fondo acumulado, no de la caja operativa
        </p>
      </div>
    </div>
    <button
      type="button"
      class="rounded-lg p-2 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-300"
      aria-label="Cerrar panel"
      [disabled]="saving()"
      (click)="onClose()"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto p-6">
    <div class="space-y-5">
      <app-input
        label="Descripción *"
        placeholder="Ej: Compra de equipo con ahorros"
        [formField]="expenseForm.description"
        [errorMessage]="descriptionError()"
      />

      <div class="grid grid-cols-2 gap-3">
        <app-money-input
          label="Monto *"
          [formField]="expenseForm.amount"
          [errorMessage]="amountError()"
        />
        <app-select
          label="Método de pago"
          [options]="paymentOptions"
          [formField]="expenseForm.paymentMethod"
        />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700" for="accumulated-payment-datetime">
          Fecha de pago
        </label>
        <input
          id="accumulated-payment-datetime"
          type="datetime-local"
          class="w-full rounded-xl border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-indigo-500"
          [value]="formModel().date"
          (input)="onDateTimeChange($any($event.target).value)"
        />
      </div>

      <app-voucher-file-picker (filesChange)="onFilesChange($event)" />
    </div>
  </div>

  <div class="flex items-center justify-end gap-3 border-t border-gray-200 bg-gray-50/60 px-6 py-4">
    <app-button
      type="button"
      variant="secondary"
      [disabled]="saving()"
      (clicked)="onClose()"
    >
      Cancelar
    </app-button>
    <app-button
      type="button"
      variant="primary"
      [loading]="saving()"
      [disabled]="!canSubmit()"
      (clicked)="onSubmit()"
    >
      {{ saveLabel() }}
    </app-button>
  </div>
</aside>
