<div
  class="fixed inset-0 z-50 flex items-end justify-center bg-black/40 p-0 backdrop-blur-sm sm:items-center sm:p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="accumulated-expense-form-title"
  (click)="onClose()"
>
  <div
    class="flex max-h-[92vh] w-full max-w-lg flex-col overflow-hidden rounded-t-2xl bg-white shadow-2xl sm:rounded-2xl"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
      <div>
        <h2 id="accumulated-expense-form-title" class="text-base font-semibold text-gray-900">
          {{ title() }}
        </h2>
        <p class="mt-0.5 text-xs text-gray-500">
          Dinero que sale del fondo acumulado, no de la caja operativa
        </p>
      </div>
      <button
        type="button"
        class="rounded-lg p-1.5 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        aria-label="Cerrar formulario"
        [disabled]="saving()"
        (click)="onClose()"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto px-5 py-4">
      <div class="space-y-5">
        <div>
          <app-input
            label="Descripción *"
            placeholder="Ej: Compra de equipo con ahorros"
            [formField]="expenseForm.description"
            [errorMessage]="descriptionError()"
          />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <app-money-input
              label="Monto *"
              [formField]="expenseForm.amount"
              [errorMessage]="amountError()"
            />
          </div>
          <div>
            <app-select
              label="Método de pago"
              [options]="paymentOptions"
              [formField]="expenseForm.paymentMethod"
            />
          </div>
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-gray-700" for="accumulated-payment-datetime">
            Fecha de pago
          </label>
          <input
            id="accumulated-payment-datetime"
            type="datetime-local"
            class="w-full rounded-xl border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-indigo-500"
            [value]="formModel().date"
            (input)="onDateTimeChange($any($event.target).value)"
          />
        </div>

        <app-voucher-file-picker (filesChange)="onFilesChange($event)" />
      </div>
    </div>

    <div class="border-t border-gray-100 px-5 py-4">
      <app-button
        type="button"
        variant="primary"
        class="w-full"
        [loading]="saving()"
        [disabled]="!canSubmit()"
        (clicked)="onSubmit()"
      >
        {{ saveLabel() }}
      </app-button>
    </div>
  </div>
</div>
