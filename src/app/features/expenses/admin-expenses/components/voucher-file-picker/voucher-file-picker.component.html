<label class="mb-1 block text-sm font-medium text-gray-700">
  Comprobantes
  <span class="font-normal text-gray-400">(opcional)</span>
</label>

<app-file-dropzone
  [maxFiles]="maxFiles"
  [maxFileSizeMb]="5"
  [accept]="accept"
  subjectLabel="comprobantes"
  formatsHint="PDF o imagen"
  (filesChange)="onFilesChange($event)"
/>
