<label class="mb-1 block text-sm font-medium text-gray-700" for="voucher-file-input">
  Comprobantes
  <span class="font-normal text-gray-400">(opcional)</span>
</label>

<div
  class="rounded-xl border-2 border-dashed p-4 text-center transition-colors"
  [class.border-indigo-400]="isDragOver()"
  [class.bg-indigo-50]="isDragOver()"
  [class.border-gray-200]="!isDragOver()"
  [class.bg-gray-50]="!isDragOver()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
>
  <svg
    class="mx-auto mb-2 h-8 w-8 text-gray-400"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="1.5"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"
    />
  </svg>
  <p class="text-sm text-gray-600">
    Arrastra PDF o imágenes, o
    <label
      for="voucher-file-input"
      class="cursor-pointer font-semibold text-indigo-600 hover:text-indigo-700"
    >
      selecciona archivos
    </label>
  </p>
  <p class="mt-1 text-xs text-gray-400">
    PDF o imagen · máx. 5 MB c/u · hasta {{ maxFiles }} archivos
  </p>
  <input
    id="voucher-file-input"
    type="file"
    class="sr-only"
    [accept]="accept"
    multiple
    (change)="onFileInputChange($event)"
  />
</div>

@if (files().length > 0) {
  <ul class="mt-2 space-y-1.5" aria-label="Archivos seleccionados">
    @for (file of files(); track fileKey(file); let i = $index) {
      <li
        class="flex items-center justify-between gap-2 rounded-lg border border-gray-100 bg-white px-3 py-2 text-sm"
      >
        <div class="flex min-w-0 items-center gap-2">
          @if (fileIcon(file) === 'pdf') {
            <svg class="h-4 w-4 shrink-0 text-red-500" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" />
            </svg>
          } @else {
            <svg class="h-4 w-4 shrink-0 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          }
          <span class="truncate text-gray-900">{{ file.name }}</span>
          <span class="shrink-0 rounded bg-gray-100 px-1.5 py-0.5 text-[10px] font-medium text-gray-500">
            {{ formatSize(file.size) }}
          </span>
        </div>
        <button
          type="button"
          class="shrink-0 rounded-lg p-1 text-gray-400 transition-colors hover:bg-red-50 hover:text-red-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
          [attr.aria-label]="'Quitar ' + file.name"
          (click)="removeFile(i)"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </li>
    }
  </ul>
}
